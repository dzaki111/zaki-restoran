<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Transaksi Kasir</title>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* ====================
           GLOBAL & CONTAINER 
           ==================== */
        body { 
            font-family: Arial, sans-serif; 
            background: #f5e7db;
            padding: 20px; 
        }
        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h2 { 
            text-align: center; 
            color: #5a4634; 
            margin-bottom: 5px;
        }
        .error { 
            color: #e74c3c; 
            font-weight: bold; 
            margin-top: 10px; 
        }

        /* ====================
           CLOCK & REFRESH
           ==================== */
        #live-clock {
            text-align: center;
            font-size: 1.1em;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* ====================
           AUTENTIKASI
           ==================== */
        #auth-section { 
            text-align: center; 
            margin-top: 50px; 
        }
        #auth-section input { 
            padding: 10px; 
            font-size: 16px; 
            margin-bottom: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px;
            display: block;
            width: 80%;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }
        #auth-section button { 
            background: #3498db;
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        #auth-section button:hover { 
            background: #2980b9; 
        }
        #transaction-data { 
            margin-top: 20px; 
            display: none; 
        }
        
        /* ====================
           SEARCH & FILTER
           ==================== */
        .search-container {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            align-items: center;
        }
        .search-container input[type="text"] {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            min-width: 150px;
        }
        .search-container button {
            background: #2c3e50; 
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .search-container button:hover {
            background: #1a242f;
        }

        /* ====================
           TABEL DATA
           ==================== */
        #printable-table {
            background-color: white; 
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            overflow-x: auto;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 5px; 
            min-width: 800px;
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left; 
            font-size: 14px; 
        }
        th { 
            background-color: #f2f2f2; 
            color: #555; 
            white-space: nowrap;
        }
        
        /* ====================
           ACTION BUTTONS
           ==================== */
        .action-buttons {
            margin-top: 15px; 
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            justify-content: flex-start;
        }
        .action-buttons button, .action-buttons a {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-size: 14px;
            text-align: center;
            display: inline-block;
            flex-shrink: 0;
            transition: background 0.2s;
            font-weight: bold;
        }
        .export-btn { background: #2ecc71; }
        .export-btn:hover { background: #27ae60; }
        .delete-btn { background: #e74c3c; }
        .delete-btn:hover { background: #c0392b; }
        .back-btn { background: #3498db; }
        .back-btn:hover { background: #2980b9; }
        .save-img-btn { background: #f39c12; }
        .save-img-btn:hover { background: #e67e22; }

    </style>
</head>
<body>
    <div class="container">
        <h2>Data Transaksi Harian</h2>
        
        <div id="live-clock"></div>

        <div id="auth-section">
            <p>Masukkan <b>Username</b> dan <b>Password</b> untuk melihat data transaksi:</p>
            <input type="text" id="username-input" placeholder="Masukkan Username">
            <input type="password" id="password-input" placeholder="Masukkan Password">
            <button onclick="checkCredentials()">Lihat Data</button>
            <p id="auth-error" class="error"></p>
        </div>

        <div id="transaction-data">
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Cari Nama, Invoice, atau Waktu..." 
                       oninput="loadTransactions(this.value.toLowerCase())">
                
                <button onclick="loadTransactions(document.getElementById('search-input').value.toLowerCase())">Cari Data</button> 
                
                <button onclick="document.getElementById('search-input').value = ''; loadTransactions('')" style="background: #95a5a6;">Tampilkan Semua</button>
                <button onclick="loadTransactions(document.getElementById('search-input').value.toLowerCase())" style="background: #e67e22;">Segarkan Data</button>
            </div>

            <div id="printable-table">
                <table>
                    <thead>
                        <tr>
                            <th>Invoice/ID</th>
                            <th>Waktu</th>
                            <th>Nama Pelanggan</th>
                            <th>Nomor Telepon</th>
                            <th>Total</th>
                            <th>Metode</th>
                            <th>Detail Pesanan</th>
                        </tr>
                    </thead>

                    <tbody id="data-body"></tbody>

                    <tr id="income-row">
                        <td colspan="7"
                            style="font-weight:bold; background:#f9f9f9; font-size:15px; color:#2c3e50;">
                            Total Pendapatan: Rp 0
                        </td>
                    </tr>

                </table>
            </div>
            
            <div class="action-buttons">
                <a href="index.html" class="back-btn">Kembali ke Menu</a>
                <button class="export-btn" onclick="exportToCsv()">Simpan Data (CSV/Excel)</button>
                <button class="save-img-btn" onclick="saveTransactionImage()">Simpan Gambar Transaksi</button>
                <button class="delete-btn" onclick="clearTransactions()">Hapus Semua Data Transaksi</button>
            </div>

        </div>
    </div>

   <script>
        /* ====================
           JAM/TANGGAL REAL-TIME
           ==================== */
        function updateClock() {
            const now = new Date();
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', options);
            
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            document.getElementById('live-clock').innerHTML = `${dateStr}, ${timeStr} WIB`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        /* ====================
           LOGIKA APLIKASI
           ==================== */

        /* AUTENTIKASI */
        const CORRECT_USERNAME = "zaki"; 
        const CORRECT_PASSWORD = "12345"; 

        function checkCredentials() {
            const usernameInput = document.getElementById('username-input').value;
            const passwordInput = document.getElementById('password-input').value;
            const errorDisplay = document.getElementById('auth-error');

            if (usernameInput === CORRECT_USERNAME && passwordInput === CORRECT_PASSWORD) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('transaction-data').style.display = 'block';
                loadTransactions(''); 
                errorDisplay.innerText = '';
            } else {
                errorDisplay.innerText = 'Username atau Password salah. Akses ditolak.';
            }
        }
        
        /* FORMAT TANGGAL HARI INI */
        function getFormattedDate() {
            const now = new Date();
            return now.toISOString().slice(0, 10);
        }

        /* LOAD DATA + TOTAL PENDAPATAN (DENGAN FILTER MULTI-KOLOM: Nama, Invoice, Waktu) */
        function loadTransactions(searchTerm = '') {
            const allTransactions = JSON.parse(localStorage.getItem('transactions')) || [];
            const dataBody = document.getElementById('data-body');
            const incomeRow = document.getElementById('income-row');

            const term = (searchTerm || '').trim().toLowerCase();

            const filteredTransactions = allTransactions.filter(tx => {
                if (!term) return true; // tampilkan semua kalau search kosong

                const name = (tx.nama || '').toString().toLowerCase();
                const id = (tx.id || '').toString().toLowerCase();
                const waktu = (tx.waktu || '').toString().toLowerCase();

                return name.includes(term) || id.includes(term) || waktu.includes(term);
            });

            dataBody.innerHTML = '';

            if (filteredTransactions.length === 0) {
                dataBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">
                    ${term ? 'Tidak ada transaksi yang cocok dengan pencarian.' : 'Belum ada transaksi yang tercatat.'}
                </td></tr>`;
                incomeRow.innerHTML = '<td colspan="7" style="font-weight:bold; background:#f9f9f9; font-size:15px; color:#2c3e50;">Total Pendapatan (Ditampilkan): Rp 0</td>';
                return;
            }

            let totalIncome = 0;

            filteredTransactions.slice().reverse().forEach(tx => {
                const total = Number(tx.total) || 0;
                totalIncome += total;

                dataBody.innerHTML += `
                    <tr>
                        <td>${tx.id || '-'}</td>
                        <td>${tx.waktu || '-'}</td>
                        <td>${tx.nama || '-'}</td>
                        <td>${tx.telepon || '-'}</td>
                        <td style="text-align:right;">Rp ${total.toLocaleString('id-ID')}</td>
                        <td>${tx.metode || '-'}</td>
                        <td>${tx.detail || '-'}</td>
                    </tr>
                `;
            });

            incomeRow.innerHTML = `
                <td colspan="7" style="font-weight:bold; background:#f9f9f9; font-size:15px; color:#2c3e50;">
                    Total Pendapatan (Ditampilkan): Rp ${totalIncome.toLocaleString('id-ID')}
                </td>
            `;
        }


        function clearTransactions() {
            if (confirm("ANDA YAKIN INGIN MENGHAPUS SEMUA DATA TRANSAKSI? Tindakan ini tidak dapat dibatalkan.")) {
                localStorage.removeItem('transactions');
                alert("Semua data transaksi berhasil dihapus!");
                loadTransactions('');
            }
        }

        function exportToCsv() {
            const transactions = JSON.parse(localStorage.getItem('transactions')) || [];
            
            if (transactions.length === 0) {
                alert("Tidak ada data transaksi untuk diekspor!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            const headers = ["Invoice/ID", "Waktu", "Nama Pelanggan", "Nomor Telepon", "Total (Rp)", "Metode", "Detail Pesanan"];
            csvContent += headers.join(",") + "\n"; 

            let totalIncome = 0;

            transactions.forEach(tx => {
                const total = Number(tx.total) || 0; 
                totalIncome += total;

                const sanitize = (data) => {
                    if (typeof data === 'string') {
                        return `"${data.replace(/"/g, '""').replace(/(\r\n|\n|\r)/gm, " ")}"`; 
                    }
                    return data;
                };

                const row = [
                    sanitize(tx.id),
                    sanitize(tx.waktu),
                    sanitize(tx.nama),
                    sanitize(tx.telepon),
                    total,
                    sanitize(tx.metode),
                    sanitize(tx.detail)
                ].join(",");

                csvContent += row + "\n";
            });

            csvContent += `"Total Pendapatan Keseluruhan","","","","${totalIncome}","",""`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            const date = getFormattedDate();
            
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Data_Transaksi_Lengkap_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function saveTransactionImage() {
            const transactions = document.getElementById('data-body').children.length;
            if (transactions === 0 || (transactions === 1 && document.getElementById('data-body').children[0].textContent.includes('Belum ada transaksi'))) {
                alert("Tidak ada transaksi untuk disimpan sebagai gambar!");
                return;
            }

            const input = document.getElementById('printable-table');

            html2canvas(input, { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
                const date = getFormattedDate();
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `Laporan_Transaksi_${date}.png`;
                a.click();
            });
        }
    </script>
</body>
</html>
